<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booleans</title>
</head>
<body>
    <script>
        true
        false

        console.log(3 > 5);

        console.log(5 === '5.00');

        if (false) {
            console.log('this is true');
        } else {
            console.log('this is false');
        }


        const age = 15;
        if(age >= 16) {
            console.log('You can Drive');
            console.log('Congrats');
        } else if (age >= 14) {
            console.log('Almost there!, you can drive with a permit');
        }else {
            console.log('You cannot Drive');
        }

        /*checks if both conditions are true*/
        console.log(true && true);
        console.log(true && false);
        console.log(0.2 >= 0 && 0.2 <= 1/3)

        /*checks if atleast one of the conditions is true*/
        console.log(true || true);
        console.log(true || false);

        /*it flips the true into the false*/
        console.log(!true); 
        console.log(!false);

        const cartQuantity = 0;
        if (cartQuantity) {
            console.log('cart has products');
        } else {
            console.log('cart is empty');
        }

        /*it is called NAN if we do invalid math operation*/
        console.log( 'text' / 5);

        /*undefined is a variable that has not been assigned a value yet*/
        let variable1;
        console.log(variable1);



        /*ternary operator*/
        const result = true ? 'truthy' : 'falsy';
        console.log(result);

        const result1 = 0 ? 'truthy' : 'falsy';
        console.log(result1);

        /*Gaurd operator*/
        /*it checks if the first condition is true, if it is true then it will run the second condition*/
        false && console.log('this will not run');
        true && console.log('this will run');
        const message = 5 && 'hello'
        console.log(message);

        /*default operator*/
        const currency = undefined || 'USD';
        console.log(currency);
    </script>
</body>
</html>
