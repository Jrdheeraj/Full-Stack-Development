<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Nova</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #07090d;
            --panel: rgba(17, 20, 27, 0.78);
            --border: rgba(255, 255, 255, 0.09);
            --text: #f5f7fa;
            --muted: #8b93a1;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(139, 92, 246, 0.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(59, 130, 246, 0.10),
                    transparent 30%
                ),
                var(--bg);
            color: var(--text);
            font-family: "DM Sans", sans-serif;
            overflow: hidden;
        }

        /* Ambient background */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            pointer-events: none;
            animation: float 12s ease-in-out infinite alternate;
        }

        body::before {
            background: #7c3aed;
            top: -180px;
            left: -150px;
        }

        body::after {
            background: #2563eb;
            bottom: -180px;
            right: -150px;
            animation-delay: -5s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(50px, 40px);
            }
        }

        /* Main wrapper */

        .wrapper {
            position: relative;
            width: 440px;
            padding: 42px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--panel);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: appear 0.8s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Top decoration */

        .top-line {
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(167, 139, 250, 0.8),
                transparent
            );
        }

        /* Logo */

        .logo {
            width: 54px;
            height: 54px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 16px;
            background: rgba(139, 92, 246, 0.08);
            box-shadow:
                inset 0 0 20px rgba(139, 92, 246, 0.08),
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo i {
            font-size: 27px;
            color: var(--accent-light);
        }

        /* Heading */

        .heading {
            text-align: center;
            margin-bottom: 34px;
        }

        .heading h1 {
            font-family: "Manrope", sans-serif;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .heading p {
            color: var(--muted);
            font-size: 14px;
        }

        /* Inputs */

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            height: 58px;
            padding: 0 52px 0 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            outline: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.035);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .input-box input::placeholder {
            color: #656d7a;
        }

        .input-box input:hover {
            border-color: rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.045);
        }

        .input-box input:focus {
            border-color: rgba(167, 139, 250, 0.55);
            background: rgba(139, 92, 246, 0.045);
            box-shadow:
                0 0 0 4px rgba(139, 92, 246, 0.08),
                0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .input-box i {
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            color: #737b89;
            font-size: 20px;
            pointer-events: none;
            transition: 0.3s ease;
        }

        .input-box input:focus + i {
            color: var(--accent-light);
        }

        /* Remember / Forgot */

        .remember-forgot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 7px 2px 25px;
            font-size: 13px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #929aa7;
            cursor: pointer;
            user-select: none;
        }

        .remember-forgot input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .remember-forgot a,
        .register-link a {
            color: var(--accent-light);
            text-decoration: none;
            transition: 0.25s ease;
        }

        .remember-forgot a:hover,
        .register-link a:hover {
            color: #c4b5fd;
        }

        /* Button */

        .btn {
            position: relative;
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 15px;
            outline: none;
            background: linear-gradient(
                135deg,
                #8b5cf6,
                #6d28d9
            );
            color: white;
            font-family: "Manrope", sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            overflow: hidden;
            box-shadow:
                0 12px 30px rgba(109, 40, 217, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: 0.3s ease;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.22),
                transparent
            );
            transform: skewX(-20deg);
            transition: 0.6s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 16px 35px rgba(109, 40, 217, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn:hover::before {
            left: 130%;
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Divider */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 27px 0;
            color: #555d69;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.07);
        }

        /* Register */

        .register-link {
            text-align: center;
            color: #737b87;
            font-size: 13px;
        }

        .register-link a {
            font-weight: 600;
        }

        /* Security text */

        .security {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 25px;
            color: #555d69;
            font-size: 11px;
        }

        .security i {
            font-size: 14px;
            color: #737b89;
        }

        /* Responsive */

        @media (max-width: 520px) {
            body {
                padding: 18px;
            }

            .wrapper {
                width: 100%;
                padding: 34px 24px;
                border-radius: 24px;
            }

            .heading h1 {
                font-size: 27px;
            }
        }

        @media (max-height: 700px) {
            .wrapper {
                padding: 28px;
            }

            .logo {
                margin-bottom: 16px;
            }

            .heading {
                margin-bottom: 24px;
            }

            .security {
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="top-line"></div>

        <div class="logo">
            <i class="bx bx-cube-alt"></i>
        </div>

        <div class="heading">
            <h1>Welcome back</h1>
            <p>Sign in to continue to your account</p>
        </div>

        <form action="#">

            <div class="input-box">
                <input
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">

                <label>
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <a href="#">Forgot password?</a>

            </div>

            <button type="submit" class="btn">
                Sign in
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="#">Create account</a>
                </p>
            </div>

            <div class="security">
                <i class="bx bx-lock-alt"></i>
                <span>Your connection is secure</span>
            </div>

        </form>

    </div>

</body>
</html>
